# SonarQube Community Build / SonarCloud - a reinforced Clean Code configuration
# Copy it to the repo root as sonar-project.properties  (used with the sonar-scanner CLI)
#
# A clear division of labour, so no tool does another's job:
#   prettier/ruff/gofmt  -> layout
#   ESLint/golangci/...  -> language rules
#   cc-scan.py           -> the team's Clean Code thresholds (functions, parameters, magic numbers)
#   Sonar                -> bugs, security hotspots, duplicated code, coverage, deeper code smells

sonar.projectKey=acme:my-service
sonar.projectName=My Service (Clean Code)
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=**/*.config.*,**/migrations/**,**/generated/**
sonar.cpd.exclusions=**/*.test.ts,**/*_test.go

# -- Quality gate: block the PR on the first run, never "we'll fix it later" -----
# Set this in the Sonar UI (Administration -> Quality Gates); copy the block as is:
#   new_coverage              < 80%   → fail
#   new_duplicated_lines_density > 3%  → fail
#   new_blocker_violations    > 0      → fail
#   new_critical_violations   > 0      → fail
#   sqale_rating (new)        worse than A → fail
#   security_hotspots (new)   > 0 reopened → fail
#
# What each number is for:
# * 80% on *new code* (not the whole repo) - enough to stop quality sliding without
#   demanding tests for code that is about to be deleted.
# * duplication 3%: turning `duplication` on is what makes DRY a measurement, not a feeling.
# * blocker/critical = 0: a PR may not add new defects. Old debt is handled later, on a plan.
# * sqale A: the "technical debt ratio" of the new code must stay at A.

# -- Rules that map directly onto the clean-code skill ---------------------------
# (idempotent: set these on the profile, do not edit the org's global profile)
# java:S107  Methods should not have too many parameters      -> max 3 (skill section 3)
# java:S104  Classes should not have too many methods
# java:S138  Methods should not be too long                   -> max 40 lines (section 3)
# java:S1121 Assignments should not be made from expressions -> one expression, one job
# java:S1126 If-else if else chains should not have a nested if -> guard clause (sections 3, 6)
# java:S1192 String literals should not be duplicated         -> magic string (section 2)
# java:S1144 Unused private methods should be removed         -> dead code (section 9)
# python:S107/138/1192 are the equivalents, plus python:S1481 unused local
# javascript:S107/138/1192/1128 (unused imports)/S1186 (empty functions -> the catch!)
